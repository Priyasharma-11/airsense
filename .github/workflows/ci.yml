name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint + tests (PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: airsense
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: airsense_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U airsense" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      AIRSENSE_TEST_DATABASE_URL: postgresql+psycopg://airsense:ci-only-password@localhost:5432/airsense_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check airsense tests alembic
      - name: Tests against PostgreSQL + PostGIS
        run: pytest --cov=airsense --cov-report=term-missing:skip-covered
      - name: Tests against SQLite
        run: AIRSENSE_TEST_DATABASE_URL= pytest -q
      - name: ML pipeline smoke test (fast training on the versioned dataset)
        run: AIRSENSE_MODELS_DIR=/tmp/models-smoke python -m airsense.ml.train --fast
        env: { PYTHONPATH: . }

  frontend:
    name: Frontend · lint, types, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx eslint src e2e
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { BACKEND_URL: "http://127.0.0.1:8000" }

  e2e:
    name: End-to-end (Playwright, full stack)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      AIRSENSE_ENV: development
      AIRSENSE_DATABASE_URL: sqlite:////tmp/airsense-e2e.db
      AIRSENSE_RATE_LIMIT_AUTH: 300/minute
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Backend - migrate, seed, serve
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m airsense.app.cli migrate
          python -m airsense.app.cli seed
          nohup uvicorn airsense.app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS localhost:8000/health/ready && break; sleep 2; done
      - name: Frontend - build and serve
        working-directory: frontend
        run: |
          npm ci
          BACKEND_URL=http://127.0.0.1:8000 npm run build
          cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
          nohup node .next/standalone/server.js > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:3000 >/dev/null && break; sleep 2; done
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env: { CI: "true" }
      - if: failure()
        run: tail -n 200 /tmp/api.log /tmp/web.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }

  docker:
    name: Docker images build
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: backend/Dockerfile, push: false, tags: airsense-api:ci }
      - uses: docker/build-push-action@v6
        with: { context: frontend, push: false, tags: airsense-web:ci }
