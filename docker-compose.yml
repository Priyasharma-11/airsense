# Local full stack: PostgreSQL 16 + PostGIS, FastAPI, Next.js
#   cp .env.example .env   # set AIRSENSE_SECRET_KEY
#   docker compose up --build
#   open http://localhost:3000  (API docs: http://localhost:8000/docs)
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: airsense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airsense-local-only}
      POSTGRES_DB: airsense
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airsense -d airsense"]
      interval: 5s
      retries: 20

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      AIRSENSE_ENV: production
      AIRSENSE_DATABASE_URL: postgresql+psycopg://airsense:${POSTGRES_PASSWORD:-airsense-local-only}@db:5432/airsense
      AIRSENSE_SECRET_KEY: ${AIRSENSE_SECRET_KEY:?set AIRSENSE_SECRET_KEY in .env (>=32 random chars)}
      AIRSENSE_CORS_ORIGINS: http://localhost:3000
      AIRSENSE_FRONTEND_URL: http://localhost:3000
      AIRSENSE_COOKIE_SECURE: "false"   # plain http on localhost
      AIRSENSE_ENABLE_SCHEDULER: ${AIRSENSE_ENABLE_SCHEDULER:-false}
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]

  web:
    build: { context: ./frontend, args: { BACKEND_URL: http://api:8000 } }
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
